name: Upstream

# Slack tags releases of slackapi/slack-cli whenever it likes, every week or
# two, so this polls hourly rather than waits for a webhook it will never get.
# It is the repository's release: a new upstream version is the only thing
# that tags.
#
# The version only reaches trunk after it has actually built, passed
# upstream's own tests and run on both architectures. That is why this pushes
# straight to trunk instead of opening a pull request: a PR raised by
# GITHUB_TOKEN does not trigger workflows, so an auto-merged one would land
# unverified.
#
# It also releases a pinned version that has no tag yet, which is how the
# first release was cut, and how a run that pushed to trunk but failed before
# tagging gets finished by the next one.
#
# The weekly move of the flake's inputs is the Weekly update, in update.yml.
# Both commit to trunk, so they share the concurrency group "update".
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      release: ${{ steps.update.outputs.release }}
      version: ${{ steps.update.outputs.version }}
      previous: ${{ steps.update.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check slackapi/slack-cli for a newer release
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous="$(jq -r .version sources.json)"
          echo "previous=$previous" >>"$GITHUB_OUTPUT"

          nix develop --command ./scripts/update.sh

          version="$(jq -r .version sources.json)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

          if git diff --quiet -- sources.json; then
            echo "updated=false" >>"$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "release=false" >>"$GITHUB_OUTPUT"
              echo "Already at $previous." >>"$GITHUB_STEP_SUMMARY"
            else
              echo "release=true" >>"$GITHUB_OUTPUT"
              echo "At \`$version\`, which has no tag yet: releasing it." >>"$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "updated=true" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
            echo "\`$previous\` -> \`$version\`" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the candidate sources.json
        if: steps.update.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: sources.json
          retention-days: 1

  verify:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources

      - uses: ./.github/actions/build
        with:
          system: ${{ matrix.system }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [check, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED: ${{ needs.check.outputs.updated }}
          VERSION: ${{ needs.check.outputs.version }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$UPDATED" = "true" ]; then
            git add sources.json
            git commit \
              -m "slack-cli: $PREVIOUS -> $VERSION" \
              -m "Built from slackapi/slack-cli v$VERSION, upstream's tests passed, and run on x86_64-linux and aarch64-linux before landing."
            git pull --rebase origin trunk
            git push origin HEAD:trunk
          fi

          # A tag per release, so a consumer can pin one exactly. On the
          # commit that pins this version, which when nothing was committed
          # here is the one that was checked out and verified.
          git tag -a "v$VERSION" -m "slack-cli $VERSION"
          git push origin "v$VERSION"

          # printf rather than a heredoc, whose body would carry this block's
          # YAML indentation into the release notes.
          printf '%s\n' \
            "The Slack CLI \`$VERSION\`, built from source at [slackapi/slack-cli v$VERSION](https://github.com/slackapi/slack-cli/releases/tag/v$VERSION) and installed as \`slack-cli\`." \
            "" \
            "Upstream documentation: https://docs.slack.dev/tools/slack-cli" \
            "" \
            "Pin this version:" \
            "" \
            '```nix' \
            "inputs.slack-cli.url = \"github:$REPOSITORY/v$VERSION\";" \
            '```' \
            >notes.md

          gh release create "v$VERSION" \
            --title "slack-cli $VERSION" \
            --notes-file notes.md
